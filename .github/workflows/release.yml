name: "Release"
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CONTAINER_CLI: docker
  BUILD_TYPE: release
  REGISTRY: quay.io/trusted-execution-clusters

jobs:
  release:
    name: "Build and push images"
    # Full VM required: ubuntu-slim has no Docker.
    # Component images build inside Containerfiles (buildroot),
    # host only needs Go/yq/operator-sdk for OLM bundle generation.
    runs-on: ubuntu-24.04
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v7

      - name: "Install Go toolchain"
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # generate-bundle-prod.sh invokes `yq` directly on PATH.
      - name: "Install yq"
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/mikefarah/yq/v4)
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${version}/yq_linux_amd64" -o /usr/local/bin/yq \
            && chmod +x /usr/local/bin/yq \
            || go install "github.com/mikefarah/yq/v4@${version}"

      - name: "Install operator-sdk"
      # Extracting the version from the go.mod file of the operator-sdk tool using awk. 
      # We are not using go list here (or any go tool for that matter) to extract the operator-sdk version because of the drift between the go versions used by tools/operator-sdk's go.mod file and the main go.mod file.
        run: |
          version=$(awk '$1 == "require" && /operator-framework\/operator-sdk/ {print $3}' tools/operator-sdk/go.mod)
          curl -fsSLo /usr/local/bin/operator-sdk \
            "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64" \
            && chmod +x /usr/local/bin/operator-sdk \
            || go install "github.com/operator-framework/operator-sdk/cmd/operator-sdk@${version}"

      # Secrets: QUAY_USERNAME and QUAY_PASSWORD in repository settings
      - name: "Log in to Quay.io"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: "Build and push images and OLM bundle"
        run: make push-all TAG=v${{ github.ref_name }}

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
