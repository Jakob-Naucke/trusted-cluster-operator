apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  # Log all requests to our CRDs at RequestResponse level
  # to capture timestamps of both request receipt and response
  - level: RequestResponse
    resources:
      - group: "trusted-execution-clusters.io"
  # Don't log watch requests from kube-proxy
  - level: None
    users: ["system:kube-proxy"]
    verbs: ["watch"]
  # Don't log health checks or metrics
  - level: None
    nonResourceURLs:
      - "/healthz*"
      - "/livez*"
      - "/readyz*"
      - "/metrics"
  # Log everything else at Metadata level (no bodies)
  - level: Metadata
    omitStages:
      - "RequestReceived"
